    apis:
        build: 
            context: .
            dockerfile: Dockerfile.local

        environment: 
            APP_PORT: 3001
            MONGO_URIS: host.docker.internal:27018
            MONGO_USERNAME: root
            MONGO_PASSWORD: root
            ELASTIC_HOST: host.docker.internal
            REDIS_HOST: http://host.docker.internal:6379

        volumes: 
            - ".:/usr/src/app"
            - "/usr/src/app/node_modules"
            
        ports: 
            - 3001:3001

